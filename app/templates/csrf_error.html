<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Error - License Tracker</title>
<style>
  :root {
    --bg-deep: #0a0e27;
    --bg-mid: #131836;
    --text-primary: #f5f7fb;
    --text-muted: rgba(245, 247, 251, 0.62);
    --accent: #6ee7ff;
    --glass-bg: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.22);
    --error: #ff8a9c;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: var(--font-sans);
    color: var(--text-primary);
    background:
      radial-gradient(circle at 15% 20%, #2b1a5e 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #0e3a5e 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
  }
  .card {
    max-width: 460px;
    width: 100%;
    padding: 40px 34px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: var(--text-muted); line-height: 1.6; margin: 0 0 24px; }
  a {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg-deep);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>We couldn't verify that request</h1>
    <p>{{ reason }}</p>
    <a href="/auth">Back to login</a>
  </div>
</body>
</html>
